[package]
name = "kubevpn"
version = "0.1.0"
edition = "2021"
description = "One mixed SOCKS5/HTTP port that routes requests to pluggable tunnel profiles"
license = "MIT"
readme = "README.md"
keywords = ["proxy", "socks5", "tunnel", "amneziawg", "xray"]
categories = ["network-programming"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
