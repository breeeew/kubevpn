[package]
name = "kubevpn"
version = "0.2.0"
edition = "2021"
description = "One mixed SOCKS5/HTTP port that routes requests to pluggable tunnel profiles"
license = "MIT"
readme = "README.md"
keywords = ["proxy", "socks5", "tunnel", "amneziawg", "xray"]
categories = ["network-programming"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
sysinfo = "0.32"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tray-icon = "0.19"
auto-launch = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
